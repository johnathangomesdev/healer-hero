# Publica o jogo no GitLab Pages a cada push na branch main
pages:
  image: alpine:latest
  stage: deploy
  script:
    - mkdir -p public
    - cp *.html manifest.webmanifest favicon.ico public/
    - mkdir -p public/icons
    - cp icons/icon-16.png icons/icon-32.png icons/icon-48.png icons/icon-192.png icons/icon-512.png icons/apple-touch-icon.png icons/healer-hero.ico public/icons/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
